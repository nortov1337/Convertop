<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertop — конвертер файлов</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">⇄</span>
      Convertop
    </a>
  </header>

  <main class="container">
    <section class="hero">
      <h1 class="hero-title">Конвертируйте файлы <span class="grad">мгновенно</span></h1>
      <p class="hero-sub">Изображения, аудио, видео, документы, данные и архивы — без установки программ</p>
    </section>

    <section class="card dropzone" id="dropzone">
      <input type="file" id="fileInput" hidden />
      <div class="dz-content">
        <div class="dz-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 16.2A4.5 4.5 0 0 1 6.5 7.5a6 6 0 0 1 11.7 1.5A4 4 0 0 1 17 16.2z" />
            <path d="M12 12v6" />
            <path d="M9.5 14.5 12 12l2.5 2.5" />
          </svg>
        </div>
        <p class="dz-title">Перетащите файл сюда</p>
        <p class="dz-sub">или нажмите, чтобы выбрать</p>
      </div>
    </section>

    <section class="card panel hidden" id="convertPanel">
      <div class="file-row">
        <div class="file-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
            <path d="M14 3v5h5" />
          </svg>
          <span class="file-name" id="fileName"></span>
        </div>
        <span class="file-meta" id="fileMeta"></span>
        <button class="link" id="resetBtn">Сбросить</button>
      </div>

      <div class="quality hidden" id="qualityRow">
        <label for="quality">Качество</label>
        <input type="range" id="quality" min="1" max="100" value="90" />
        <span class="quality-value" id="qualityValue">90</span>
      </div>

      <div class="targets" id="targets"></div>

      <button class="primary" id="convertBtn" disabled>
        <span class="btn-label">Конвертировать</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
      <div class="status hidden" id="status"></div>
    </section>

    <section class="card panel hidden result-panel" id="resultPanel">
      <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
        <circle class="check-circle" cx="26" cy="26" r="24" fill="none" />
        <path class="check-mark" fill="none" d="M14 27l8 8 16-16" />
      </svg>
      <p class="result-ok">Готово</p>
      <p class="result-name" id="resultName"></p>
      <div class="result-actions">
        <a class="primary" id="downloadLink" download>Скачать файл</a>
        <button class="link" id="againBtn">Конвертировать ещё</button>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
